{% extends "base.html" %}

{% block title %}500 Internal Error - SecureDocs{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="display-1 text-danger fw-bold mb-3">
      <i class="bi bi-exclamation-octagon"></i> 500
    </div>
    <h3 class="fw-bold text-dark">Internal Server Error</h3>
    <p class="text-secondary mb-4">
      An unexpected error occurred while processing your request. Any pending database transactions were rolled back safely.
    </p>
    <a href="{{ url_for('documents.dashboard') }}" class="btn btn-primary">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}

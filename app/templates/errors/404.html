{% extends "base.html" %}

{% block title %}404 Not Found - SecureDocs{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="display-1 text-primary fw-bold mb-3">
      <i class="bi bi-file-earmark-x"></i> 404
    </div>
    <h3 class="fw-bold text-dark">Document or Page Not Found</h3>
    <p class="text-secondary mb-4">
      The requested document or resource does not exist or has been permanently removed by its owner.
    </p>
    <a href="{{ url_for('documents.dashboard') }}" class="btn btn-primary">
      <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
